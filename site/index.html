<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarah McGuire Baked Goods</title>
<meta name="description" content="Cakes, cookies and pies, made by hand in Midtown Tulsa. Custom celebration cakes, decorated cookies and everyday bakes, made to order.">
<link rel="icon" type="image/png" href="assets/logo/mark-pecan.png">
<style>/* Webfonts — Google Fonts, self-hosted (latin subset).
   Cormorant Garamond — headers & body (brand font, exact).
   IM Fell English SC — subheaders / tracked caps (replaces Bodoni FLF; letterpress small caps echo the distressed wordmark).
   Ms Madi — accent script (replaces Amsterdam Four; monoline signature like the logo's "Baked Goods"). */
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:400;font-display:swap;src:url("assets/fonts/cormorant-garamond-italic.woff2") format('woff2');}
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-display:swap;src:url("assets/fonts/cormorant-garamond-italic.woff2") format('woff2');}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/cormorant-garamond.woff2") format('woff2');}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:500;font-display:swap;src:url("assets/fonts/cormorant-garamond.woff2") format('woff2');}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:600;font-display:swap;src:url("assets/fonts/cormorant-garamond.woff2") format('woff2');}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:700;font-display:swap;src:url("assets/fonts/cormorant-garamond.woff2") format('woff2');}
@font-face{font-family:'IM Fell English SC';font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/im-fell-english-sc.woff2") format('woff2');}
@font-face{font-family:'Ms Madi';font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/ms-madi.woff2") format('woff2');}

/* Sarah McGuire Baked Goods — color tokens
   The six named brand colors are exact from the Brand Guide.
   Tints/shades are derived (oklch-adjacent steps) for UI states. */
:root{
  /* Brand palette (exact) */
  --southern-pecan:#7B5A43;
  --woodland-olive:#8C8F6B;
  --creamed-butter:#F8F2E7;
  --honey-amber:#E2C17D;
  --moonlit-lavender:#C7C4CF;
  --dusty-rose:#C7A6A1;

  /* Pecan ramp — primary ink */
  --pecan-50:#F4EDE6;--pecan-100:#E9DDD1;--pecan-200:#D6C3B2;--pecan-300:#B89C86;--pecan-400:#9A7B64;
  --pecan-500:#7B5A43;--pecan-600:#684B37;--pecan-700:#553D2D;--pecan-800:#412E22;--pecan-900:#2E2018;
  /* Olive ramp */
  --olive-50:#F2F2EA;--olive-100:#E4E5D6;--olive-200:#C9CBB1;--olive-300:#ADB08E;--olive-500:#8C8F6B;--olive-600:#74775A;--olive-700:#5C5F47;--olive-800:#44463A;
  /* Cream / paper ramp — surfaces */
  --cream-0:#FFFDF9;--cream-50:#FCF8F1;--cream-100:#F8F2E7;--cream-200:#F1E7D6;--cream-300:#E8DAC4;--cream-400:#D9C7AB;
  /* Honey */
  --honey-100:#F6EBD2;--honey-300:#ECD7A6;--honey-500:#E2C17D;--honey-700:#A8843F;
  /* Rose */
  --rose-100:#F1E6E3;--rose-300:#DCC4C0;--rose-500:#C7A6A1;--rose-700:#95706B;
  /* Lavender */
  --lavender-100:#EEEDF1;--lavender-300:#DAD8E0;--lavender-500:#C7C4CF;--lavender-700:#7F7A8E;
  /* Kraft — packaging neutral seen on boxes/bags in brand mockup (derived) */
  --kraft:#C9A67C;

  /* ---- Semantic aliases ---- */
  --bg-page:var(--creamed-butter);
  --bg-paper:var(--cream-50);
  --surface-card:var(--cream-0);
  --surface-sunken:var(--cream-200);
  --surface-inverse:var(--southern-pecan);
  --surface-olive:var(--woodland-olive);
  --surface-rose:var(--dusty-rose);
  --surface-honey:var(--honey-100);

  --text-strong:var(--pecan-800);
  --text-body:var(--pecan-700);
  --text-brand:var(--southern-pecan);
  --text-muted:var(--pecan-500);
  --text-subtle:var(--pecan-400);   /* large/decorative only */
  --text-on-dark:var(--creamed-butter);
  --text-accent:var(--olive-700);

  --line-hair:var(--cream-300);
  --line-soft:var(--pecan-200);
  --line-strong:var(--southern-pecan);

  --action-primary:var(--southern-pecan);
  --action-primary-hover:var(--pecan-600);
  --action-primary-press:var(--pecan-700);
  --action-secondary:var(--woodland-olive);
  --action-secondary-hover:var(--olive-600);
  --focus-ring:var(--honey-500);

  --status-success:var(--olive-600);--status-success-bg:var(--olive-100);
  --status-warning:var(--honey-700);--status-warning-bg:var(--honey-100);
  --status-error:#A35A50;--status-error-bg:var(--rose-100);
  --status-info:var(--lavender-700);--status-info-bg:var(--lavender-100);

  --overlay-scrim:rgba(46,32,24,.42);
}

/* Typography — Headers & body: Cormorant Garamond. Subheaders: IM Fell English SC. Accent script: Ms Madi. */
:root{
  --font-serif:'Cormorant Garamond','Cormorant',Garamond,'Times New Roman',serif;
  --font-caps:'IM Fell English SC','IM Fell English',Garamond,serif;
  --font-script:'Ms Madi','Snell Roundhand',cursive;

  --font-display:var(--font-serif);
  --font-heading:var(--font-serif);
  --font-subhead:var(--font-caps);
  --font-body:var(--font-serif);
  --font-accent:var(--font-script);

  /* Scale (Cormorant runs small — body sits at 19px) */
  --fs-display:72px;--fs-h1:56px;--fs-h2:42px;--fs-h3:32px;--fs-h4:24px;
  --fs-lead:23px;--fs-body:19px;--fs-small:16px;--fs-caption:14px;
  --fs-eyebrow:13px;--fs-script:48px;

  --fw-regular:400; /* @kind font */
  --fw-medium:500; /* @kind font */
  --fw-semibold:600; /* @kind font */
  --fw-bold:700; /* @kind font */
  --lh-tight:1.05; /* @kind font */
  --lh-heading:1.15; /* @kind font */
  --lh-body:1.55; /* @kind font */
  --lh-loose:1.75; /* @kind font */

  --ls-display:-0.01em; /* @kind font */
  --ls-heading:0; /* @kind font */
  --ls-body:0.005em; /* @kind font */
  --ls-eyebrow:0.32em; /* @kind font */
  --ls-button:0.22em; /* @kind font */
}

:root{
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;
  --space-7:48px;--space-8:64px;--space-9:96px;--space-10:128px;
  --container-max:1180px;--container-narrow:720px;--gutter:24px;
  --control-h-sm:36px;--control-h-md:46px;--control-h-lg:56px;
}

/* Radii, borders, shadows, motion. Paper-and-kraft feel: soft corners, warm low shadows. */
:root{
  --radius-xs:2px;--radius-sm:4px;--radius-md:8px;--radius-lg:14px;--radius-xl:24px;--radius-pill:999px;--radius-round:50%;
  --radius-control:var(--radius-sm);--radius-card:var(--radius-md);

  --border-hair:1px solid var(--line-hair);
  --border-soft:1px solid var(--line-soft);
  --border-strong:1px solid var(--line-strong);

  /* Shadows are pecan-tinted, never grey */
  --shadow-1:0 1px 2px rgba(65,46,34,.06),0 1px 1px rgba(65,46,34,.04);
  --shadow-2:0 2px 6px rgba(65,46,34,.07),0 8px 20px -8px rgba(65,46,34,.12);
  --shadow-3:0 4px 10px rgba(65,46,34,.08),0 20px 44px -16px rgba(65,46,34,.22);
  --shadow-focus:0 0 0 3px rgba(226,193,125,.6);

  --ease-out:cubic-bezier(.22,.61,.36,1); /* @kind other */
  --ease-in-out:cubic-bezier(.65,0,.35,1); /* @kind other */
  --dur-fast:140ms; /* @kind other */
  --dur-base:220ms; /* @kind other */
  --dur-slow:420ms; /* @kind other */
}

/* Light element defaults so plain HTML picks up the brand */
html{background:var(--bg-page);color:var(--text-body);font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
body{margin:0}
h1,h2,h3,h4{font-family:var(--font-heading);color:var(--text-strong);font-weight:var(--fw-medium);line-height:var(--lh-heading);margin:0;text-wrap:balance}
p{text-wrap:pretty}
a{color:var(--southern-pecan);text-decoration:underline;text-decoration-color:var(--pecan-300);text-underline-offset:3px}
a:hover{color:var(--pecan-700);text-decoration-color:currentColor}
::selection{background:var(--honey-300);color:var(--pecan-900)}

/* ---- Screen sizes: phone, tablet, desktop, large monitor ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img{max-width:100%}
.site-footer-grid{grid-template-columns:1.1fr 1fr 1fr 1.3fr}
/* Menu button (phones only) */
.menu-toggle{display:none;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-10px;padding:0;background:none;border:none;border-radius:var(--radius-control);cursor:pointer;color:var(--text-strong)}
.menu-toggle:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
.menu-toggle-bars{position:relative;display:block;width:22px;height:14px}
.menu-toggle-bars span{position:absolute;left:0;right:0;height:1.5px;background:currentColor;border-radius:2px;transition:transform var(--dur-base) var(--ease-out),opacity var(--dur-fast)}
.menu-toggle-bars span:nth-child(1){top:0}
.menu-toggle-bars span:nth-child(2){top:6px}
.menu-toggle-bars span:nth-child(3){top:12px}
.menu-toggle[aria-expanded="true"] .menu-toggle-bars span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.menu-toggle[aria-expanded="true"] .menu-toggle-bars span:nth-child(2){opacity:0}
.menu-toggle[aria-expanded="true"] .menu-toggle-bars span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
/* Tablets: two-column footer; stacked photos become landscape instead of very tall */
@media (max-width:900px){
  .site-footer-grid{grid-template-columns:1fr 1fr}
  .photo-tall{aspect-ratio:4/3 !important;max-height:70vh}
}
/* Phones */
@media (max-width:560px){
  .site-footer-grid{grid-template-columns:1fr;gap:28px}
  /* Menu becomes a drop-down behind the menu button */
  .site-header-row{padding-bottom:14px !important}
  .menu-toggle{display:inline-flex}
  .site-nav{display:none !important;position:absolute;top:100%;left:0;right:0;z-index:40;max-width:none !important;
    flex-direction:column;padding:6px 0 10px !important;background:var(--cream-50);border-bottom:1px solid var(--line-soft);box-shadow:var(--shadow-2)}
  .site-nav.is-open{display:flex !important}
  .site-nav button{width:100%;text-align:left;padding:15px 24px !important;font-size:13px !important;border-bottom:1px solid var(--line-hair) !important;border-left:3px solid transparent !important}
  .site-nav button:last-child{border-bottom:none !important}
  .site-nav button[aria-current="page"]{border-left-color:var(--southern-pecan) !important;background:var(--cream-200) !important}
  .site-footer button{padding:9px 0 !important}
}
/* Small or sideways phones: don't pin the (tall) header to the top */
@media (max-width:560px),(max-height:500px){
  .site-header{position:relative !important}
}
/* Large monitors: scale the whole design up a little */
@media (min-width:1700px){#dc-root{zoom:1.12}}
@media (min-width:2200px){#dc-root{zoom:1.3}}

</style>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="support.js"></script>

<script src="admin.js"></script>
</head>

{id:'pecan',name:'Honey Pecan Pie',price:34,unit:'9-inch pie',desc:'Oklahoma pecans, all-butter crust',badge:'Seasonal',tone:'olive'},
{id:'apple',name:'Lattice Apple Pie',price:32,unit:'9-inch pie',desc:'Tart apples, brown sugar, cinnamon'},
{id:'banana',name:'Banana Bread',price:14,unit:'loaf',desc:'Very ripe bananas, crackly sugar top'}
];
// Each page has its own address (#menu, #pickup, ...), so links and the back button work.
const PAGES={home:'',menu:'Menu & Prices',pickup:'Pickup & FAQ',about:'About',contact:'Contact',order:'Request an Order'};
const SITE_NAME='Sarah McGuire Baked Goods';
const pageFromHash=()=>{const h=decodeURIComponent(location.hash.slice(1));return Object.prototype.hasOwnProperty.call(PAGES,h)?h:'home';};
const setTitle=page=>{document.title=PAGES[page]?PAGES[page]+' · '+SITE_NAME:SITE_NAME;};
class Component extends DCLogic{
  state={page:pageFromHash(),box:{},toast:null,startCustom:false,menuOpen:false};
  go=(page,opts)=>{
    if(page!==this.state.page)history.pushState(null,'',page==='home'?location.pathname+location.search:'#'+page);
    setTitle(page);
    this.setState({page,startCustom:!!(opts&&opts.custom),toast:null,menuOpen:false});window.scrollTo(0,0);
  };
  toggleMenu=()=>this.setState(s=>({menuOpen:!s.menuOpen}));
  // Close the phone menu on Escape or a tap outside the header.
  onKey=e=>{if(e.key==='Escape'&&this.state.menuOpen)this.setState({menuOpen:false});};
  onDocClick=e=>{if(this.state.menuOpen&&!(e.target.closest&&e.target.closest('.site-header')))this.setState({menuOpen:false});};
  onNav=()=>{const page=pageFromHash();setTitle(page);if(page!==this.state.page){this.setState({page,startCustom:false,toast:null,menuOpen:false});window.scrollTo(0,0);}};
  componentDidMount(){setTitle(this.state.page);window.addEventListener('popstate',this.onNav);window.addEventListener('hashchange',this.onNav);document.addEventListener('keydown',this.onKey);document.addEventListener('click',this.onDocClick);}
  add=(id)=>{this.setState(s=>({box:{...s.box,[id]:(s.box[id]||0)+1},toast:'Added to your box'}));clearTimeout(this.t);this.t=setTimeout(()=>this.setState({toast:null}),3500);};
  setQty=(id,n)=>this.setState(s=>{const b={...s.box};if(n<=0)delete b[id];else b[id]=n;return{box:b};});
  clearBox=()=>this.setState({box:{}});
  componentWillUnmount(){clearTimeout(this.t);window.removeEventListener('popstate',this.onNav);window.removeEventListener('hashchange',this.onNav);document.removeEventListener('keydown',this.onKey);document.removeEventListener('click',this.onDocClick);}
  renderVals(){
    const p=this.state.page;
    const count=Object.values(this.state.box).reduce((a,b)=>a+b,0);
    const nav=[['menu','Menu & Prices'],['pickup','Pickup & FAQ'],['about','About'],['contact','Contact']].map(([id,label])=>({label,active:p===id,inactive:p!==id,onClick:()=>this.go(id)}));
    return {
      nav,go:this.go,
      navClass:'site-nav'+(this.state.menuOpen?' is-open':''),menuExpanded:this.state.menuOpen?'true':'false',
      menuLabel:this.state.menuOpen?'Close menu':'Open menu',toggleMenu:this.toggleMenu,add:this.add,setQty:this.setQty,clearBox:this.clearBox,
      everyday:EVERYDAY,box:this.state.box,startCustom:this.state.startCustom,
      boxBadge:count||undefined,toast:this.state.toast,hideToast:()=>this.setState({toast:null}),
      isHome:p==='home',isMenu:p==='menu',isAbout:p==='about',isPickup:p==='pickup',isContact:p==='contact',isOrder:p==='order',
      goHome:()=>this.go('home'),openAdmin:()=>window.smbOpenAdmin&&window.smbOpenAdmin(),goMenu:()=>this.go('menu'),goOrder:()=>this.go('order'),goPickup:()=>this.go('pickup'),goContact:()=>this.go('contact'),
      showAnnouncement:this.props.showAnnouncement??true,
      heroStyle:this.props.heroStyle??'photo',
      offerDelivery:this.props.offerDelivery??true
    };
  }
}
</script>
